<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shackle AI — Hall of Frauds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('shackle-theme') || 'light'); })();
  </script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root, html[data-theme="light"] {
      --red:    #c23a2f;
      --red-tint: rgba(194,58,47,0.08);
      --red-tint-2: rgba(194,58,47,0.18);
      --amber:  #b8791f;
      --amber-tint: rgba(184,121,31,0.10);
      --green:  #1f8f5c;
      --ink:    #f2ede1;
      --header-bg: #ece5d2;
      --rule:   #ddd2b3;
      --muted:  #8a8371;
      --sub:    #6b6552;
      --text:   #23211b;
      --text-2: #55503f;
    }
    html[data-theme="dark"] {
      --red:    #e0453a;
      --red-tint: rgba(224,69,58,0.08);
      --red-tint-2: rgba(224,69,58,0.2);
      --amber:  #e8a83d;
      --amber-tint: rgba(232,168,61,0.1);
      --green:  #33c17a;
      --ink:    #0b0d10;
      --header-bg: #0e0808;
      --rule:   #262a2f;
      --muted:  #6b7178;
      --sub:    #9aa0a6;
      --text:   #ffffff;
      --text-2: #c3c7cc;
    }

    body {
      background: var(--ink);
      color: var(--text-2);
      font-family: 'IBM Plex Sans', sans-serif;
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    header {
      background: var(--header-bg);
      border-bottom: 2px solid var(--red);
      padding: 20px 20px 0;
      text-align: center;
      position: relative;
      transition: background 0.2s, border-color 0.2s;
    }
    .theme-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text-2);
      background: transparent;
      border: 1px solid var(--rule);
      padding: 7px 10px;
      cursor: pointer;
      text-transform: uppercase;
      transition: border-color 0.15s, color 0.15s;
    }
    .theme-toggle:hover { border-color: var(--red); color: var(--red); }

    .logo {
      font-family: 'IBM Plex Mono', monospace;
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 700;
      letter-spacing: 6px;
      color: var(--text);
      padding-top: 8px;
    }
    .logo span { color: var(--red); }
    .tagline {
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      margin-top: 6px;
      letter-spacing: 1.5px;
    }

    /* ── Ticker ── */
    .ticker {
      margin-top: 20px;
      background: var(--red-tint);
      border-top: 1px solid var(--red-tint-2);
      display: flex;
      justify-content: center;
      gap: 0;
      font-family: 'IBM Plex Mono', monospace;
    }
    .ticker-item {
      flex: 1;
      max-width: 220px;
      padding: 16px 12px;
      text-align: center;
      border-right: 1px solid var(--red-tint-2);
      position: relative;
    }
    .ticker-item:last-child { border-right: none; }
    .ticker-num {
      font-size: clamp(24px, 5vw, 32px);
      font-weight: 700;
      color: var(--red);
    }
    .ticker-label {
      font-size: 9.5px;
      color: var(--muted);
      margin-top: 4px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 12px 0 18px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--red);
      font-weight: 700;
    }
    .pulse-dot {
      width: 7px; height: 7px;
      background: var(--red);
      border-radius: 50%;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.25; transform: scale(0.7); }
    }

    .container { max-width: 780px; margin: 0 auto; padding: 32px 16px 60px; }

    .section-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--rule);
    }
    .section-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--sub);
      text-transform: uppercase;
      font-weight: 700;
    }

    /* ── Docket entries ── */
    .fraud-entry {
      display: flex;
      border-bottom: 1px solid var(--rule);
      animation: fadeSlide 0.35s ease forwards;
      opacity: 0;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .entry-tab {
      width: 46px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 700;
    }
    .tab-1 { background: var(--amber-tint); color: var(--amber); }
    .tab-2 { background: var(--red-tint); color: var(--red); }
    .tab-3 { background: var(--red); color: #fff; }

    .entry-body { flex: 1; padding: 18px 20px; min-width: 0; }

    .entry-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .username { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 700; color: var(--text); }
    .timestamp { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted); }

    .infraction-type {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11.5px;
      color: var(--sub);
      margin-bottom: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .roast-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9.5px;
      color: var(--muted);
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .roast-text {
      font-size: 13px;
      font-style: italic;
      color: var(--text-2);
      line-height: 1.6;
      border-left: 2px solid var(--rule);
      padding-left: 12px;
    }

    .empty {
      text-align: center;
      padding: 70px 20px;
      color: var(--muted);
      border: 1px dashed var(--rule);
    }
    .empty-icon { font-size: 30px; margin-bottom: 12px; opacity: 0.5; }
    .empty-title { font-family: 'IBM Plex Mono', monospace; font-size: 14px; margin-bottom: 6px; color: var(--sub); font-weight: 700; }
    .empty-sub { font-size: 12.5px; color: var(--muted); }

    .footer {
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 34px;
      letter-spacing: 0.5px;
    }
    .footer span { color: var(--sub); }

    .skeleton {
      background: linear-gradient(90deg, var(--rule) 25%, var(--header-bg) 50%, var(--rule) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      height: 84px;
      border-bottom: 1px solid var(--rule);
      opacity: 0.5;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    @media (max-width: 500px) {
      .ticker { flex-wrap: wrap; }
      .ticker-item { max-width: none; width: 33.33%; flex: none; }
      .entry-tab { width: 36px; font-size: 11px; }
      .entry-body { padding: 14px 14px; }
      .theme-toggle { position: static; margin: 0 auto 8px; display: block; width: fit-content; }
    }
  </style>
</head>
<body>

<header>
  <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">● DARK MODE</button>
  <div class="logo">⛓ HALL OF <span>FRAUDS</span></div>
  <div class="tagline">REAL-TIME PROCRASTINATION VIOLATIONS · POWERED BY SHACKLE AI</div>
  <div class="live-badge"><div class="pulse-dot"></div>LIVE MONITOR FEED</div>

  <div class="ticker">
    <div class="ticker-item"><div class="ticker-num" id="stat-total">—</div><div class="ticker-label">Total Frauds</div></div>
    <div class="ticker-item"><div class="ticker-num" id="stat-users">—</div><div class="ticker-label">Users Caught</div></div>
    <div class="ticker-item"><div class="ticker-num" id="stat-strike3">—</div><div class="ticker-label">Strike 3s</div></div>
  </div>
</header>

<div class="container">

  <div class="section-header-row">
    <div class="section-title">Latest Infractions Ledger</div>
  </div>

  <div id="list">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton" style="opacity:0.2"></div>
  </div>

  <div class="footer" id="footer">Connecting to the database indices...</div>
  <div class="footer" style="margin-top:8px;"><a href="/roadmap" style="color:var(--red);text-decoration:none;">See what's coming next →</a></div>

</div>

<script>
  function toggleTheme() {
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', next);
    localStorage.setItem('shackle-theme', next);
    updateToggleLabel(next);
  }
  function updateToggleLabel(theme) {
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.textContent = theme === 'light' ? '● DARK MODE' : '☀ LIGHT MODE';
  }
  updateToggleLabel(document.documentElement.getAttribute('data-theme'));

  function timeAgo(ts) {
    const diff = (Date.now() / 1000) - ts;
    if (diff < 5)    return 'just now';
    if (diff < 60)   return `${Math.floor(diff)}s ago`;
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400)return `${Math.floor(diff / 3600)}h ago`;
    return `${Math.floor(diff / 86400)}d ago`;
  }

  function tabClass(n) {
    return n >= 3 ? 'tab-3' : n === 2 ? 'tab-2' : 'tab-1';
  }

  async function load() {
    try {
      const res  = await fetch('/v1/hall-of-frauds');
      const data = await res.json();
      const all  = (data.frauds || []).filter(f => f.type !== 'autonomous_audit');

      const users   = new Set(all.map(f => f.username)).size;
      const strike3 = all.filter(f => (f.strike_number || 0) >= 3).length;
      document.getElementById('stat-total').textContent   = all.length;
      document.getElementById('stat-users').textContent   = users;
      document.getElementById('stat-strike3').textContent = strike3;

      const list = document.getElementById('list');

      if (all.length === 0) {
        list.innerHTML = `
          <div class="empty">
            <div class="empty-icon">👁</div>
            <div class="empty-title">Enforcement ledger clear.</div>
            <div class="empty-sub">Active environment processes are fully compliant, or no sessions are live.</div>
          </div>`;
      } else {
        list.innerHTML = all.slice(0, 50).map((f, i) => `
          <div class="fraud-entry" style="animation-delay:${i * 0.04}s">
            <div class="entry-tab ${tabClass(f.strike_number || 1)}">${f.strike_number || 1}/3</div>
            <div class="entry-body">
              <div class="entry-top">
                <span class="username">@${f.username || 'anonymous'}</span>
                <span class="timestamp">${timeAgo(f.timestamp)}</span>
              </div>
              <div class="infraction-type">${f.infraction_type || f.trigger_type || 'Unspecified violation'}</div>
              ${f.roast_delivered ? `
                <div class="roast-label">Enforcement Core Evaluation</div>
                <div class="roast-text">"${f.roast_delivered}"</div>
              ` : ''}
            </div>
          </div>
        `).join('');
      }

      document.getElementById('footer').innerHTML =
        `Ledger synchronized <span>${new Date().toLocaleTimeString()}</span> · Auto pulling database changes every 30s`;

    } catch (err) {
      document.getElementById('list').innerHTML = `
        <div class="empty">
          <div class="empty-icon">📡</div>
          <div class="empty-title">Data stream connection timeout.</div>
          <div class="empty-sub">Unable to synchronize metrics with the local desktop daemon.</div>
        </div>`;
      document.getElementById('footer').textContent = 'Sync state disconnected.';
    }
  }

  load();
  setInterval(load, 30000);
</script>

</body>
</html>
